[pytest]
# Puts the project root on sys.path for every test run, so tests can do
# `from shared.schemas import ...` and `from ensemble... import ...` without
# setting PYTHONPATH (the bash-style `PYTHONPATH=. pytest` does not work in
# Windows PowerShell). Requires pytest >= 7, which requirements.txt already pins.
pythonpath = .
testpaths = tests